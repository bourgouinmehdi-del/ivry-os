name: Publier IVRY OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ivry-release.jks"

      - name: Construire l'APK
        env:
          IVRY_KEYSTORE: ${{ runner.temp }}/ivry-release.jks
          IVRY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IVRY_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ivry-os.apk
          gh release create "v${{ github.run_number }}" ivry-os.apk \
            --title "IVRY OS 1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)"
